name: Deploy to Rumahweb

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_ROOT: ${{ secrets.FTP_ROOT }}
      APP_KEY: ${{ secrets.APP_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, zip, pdo_sqlite

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-scripts

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies & Build
      run: |
        npm ci
        npm run build

    - name: Generate .env.production
      run: |
        cp .env.example .env.production
        echo "APP_ENV=production" >> .env.production
        echo "APP_DEBUG=false" >> .env.production
        echo "APP_URL=${{ secrets.APP_URL }}" >> .env.production
        echo "DB_CONNECTION=mysql" >> .env.production
        echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env.production
        echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env.production
        echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env.production
        echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env.production
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.production
        echo "CACHE_DRIVER=mysql" >> .env.production
        echo "SESSION_DRIVER=mysql" >> .env.production
        echo "QUEUE_CONNECTION=database" >> .env.production
        echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env.production

    - name: Upload via FTP
      uses: samuelmeuli/action-ftp-upload@v1
      with:
        server: ${{ env.FTP_HOST }}
        username: ${{ env.FTP_USER }}
        password: ${{ env.FTP_PASS }}
        source: './'
        target: ${{ env.FTP_ROOT }}
        ignore: '.git .github .idea .vscode node_modules vendor storage framework bootstrap/cache'

    - name: Create unzip.php
      run: |
        cat > deploy_package/unzip.php << 'EOF'
        <?php
        @set_time_limit(600);
        @ini_set('max_execution_time', 600);
        @ini_set('memory_limit', '512M');
        
        $token = '{{ secrets.DEPLOY_TOKEN }}';
        if (!isset($_GET['token']) || $_GET['token'] !== $token) {
            header('HTTP/1.0 403 Forbidden');
            exit('Forbidden');
        }
        
        // Run migrations
        putenv('LARAVEL_EXECUTION_TIME=600');
        $output = [];
        $return = 0;
        exec('php artisan migrate --force 2>&1', $output, $return);
        echo "Migrations: " . implode("\n", $output) . "\n";
        
        // Optimize
        exec('php artisan config:cache 2>&1', $output, $return);
        exec('php artisan route:cache 2>&1', $output, $return);
        exec('php artisan view:cache 2>&1', $output, $return);
        echo "Optimization complete\n";
        EOF

    - name: Trigger deployment
      run: |
        TOKEN=$(openssl rand -hex 16)
        echo "DEPLOY_TOKEN=$TOKEN" >> $GITHUB_ENV
        curl -s "https://${{ secrets.APP_DOMAIN }}/unzip.php?token=$TOKEN" || true
